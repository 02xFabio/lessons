<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>lesson 13</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/nullstyle.css">
</head>
<body>
	<div class='wrapper'>
		<header class='header'>
		</header>
		<main class='page'>
			<div class='form__conteiner _conteiner'>
			<form action="#" class="form">
				<div class="menu_text">
					<label class="label_1" for="name_1">Your name</label>
					<input autocomplete="off" required id="name_1" name="form[]" type="text" placeholder="Abc" class="menu_item">
				</div>
				<div class="menu_text">
					<label class="label_1" for="name_1">Email address</label>
					<input autocomplete="off"  required id="name_1" name="form[]" type="email" placeholder="Abc@def.com" class="menu_item">
				</div>
				<div class="menu_text">
					<label class="label_1" for="name_1">Subject</label>
					<input autocomplete="off" required id="name_1" name="form[]" type="text" placeholder="This is an optional" class="menu_item">
				</div>
				<div class="menu_text">
					<label class="label_1" for="name_1">Message</label>
					<textarea class="menu_item menu_item_1" name="form[] " id="" placeholder="Hi! i’d like to ask about"></textarea>
				</div>
				<div class="menu_text">
					<button type="submit" class="button" name="form[]">Submit</button>
				</div>
			</form>
			<div class="form__color">
				<div class="body">
					<div class="size">
						<h1 class="size__titel">Size</h1>
						<div class="size__content">
								<input type="radio" name="group" id="btn1" class="radio-input">
								<input type="radio" name="group" id="btn2" class="radio-input">
								<input type="radio" name="group" id="btn3" class="radio-input">
								<div class="buttons">
									<label for="btn1" class="button-size l">L</label>
									<label for="btn2" class="button-size xl">XL</label>
									<label for="btn3" class="button-size xs">XS</label>
								</div>
						</div>
					</div>
					<div class="color">
						<h1 class="color__titel">Color</h1>
						<div class="color__content">
							<input type="radio" name="color" id="toggle-btn" class="hidden-radio">
							<input type="radio" name="color" id="toggle-btn_2" class="hidden-radio">
							<input type="radio" name="color" id="toggle-btn_3" class="hidden-radio">
							<div class="buttons">
								<label for="toggle-btn" class="button-label__purpel purpel"></label>
								<label for="toggle-btn_2" class="button-label__black black"></label>
								<label for="toggle-btn_3" class="button-label__golden golden"></label>
							</div>
						</div>
					</div>
				</div>
			</div>
			</div>
		</main>
		<footer class='footer'></footer>
	</div>
	
</body>
</html>
